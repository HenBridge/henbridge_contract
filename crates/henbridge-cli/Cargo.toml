[package]
name = "henbridge-cli"
version = "0.1.0"
edition = "2021"
description = "HenBridge admin CLI - interacts with Soroban contracts using config/networks.toml"
license = "MIT"
repository = "https://github.com/HenBridge/henbridge_contract"

[[bin]]
name = "henbridge-cli"
path = "src/main.rs"

[dependencies]
henbridge-config = { path = "../henbridge-config" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
